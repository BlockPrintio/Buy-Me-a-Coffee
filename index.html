    <!--
      DIRECTION: socialist-kiosk-print
      THESIS: Support is a public act, so the page is printed like a public
      notice — not the rounded card-and-gradient SaaS landing this category
      always ships. It refuses the soft product-shot hero.
      OWN-WORLD: Three inks on newsprint — scarlet #CE2B14, press black
      #0E0C0A, sheet #F4EEE1, with Cardano blue demoted to a spot ink. Anton
      caps locked up tight, Archivo running text, Courier Prime for machine
      data. 3px rules, square corners, halftone screens, hard out-of-register
      plate offsets, hard diagonal cuts. No radius, no glow, no gradient.
      STORY: A Cardano creator sees funding stated as fact, believes the split
      is enforced rather than promised, and starts a page.
      FIRST VIEWPORT: Full-bleed scarlet field, headline set as a four-line
      black-and-paper lockup at 8xl, the support ticket printed as an
      out-of-register plate to the right, primary action directly under the
      lockup on the left.
      FORM: Poster/kiosk print, pinned by the user; the direction roll was
      skipped because a pinned brief beats the roll.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
